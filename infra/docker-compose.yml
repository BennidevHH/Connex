version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api
      - realtime

  api:
    build: ./backend-java
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/connex

  realtime:
    build: ./backend-node
    ports:
      - "3001:3001"
    environment:
      - MONGO_URL=mongodb://mongo:27017/connex

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: