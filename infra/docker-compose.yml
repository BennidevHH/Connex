version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: connex
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ../backend
    depends_on:
      - mysql
      - mongo
    environment:
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_JDBC_URL=jdbc:mysql://mysql:3306/connex
      - MONGODB_URI=mongodb://mongo:27017/connex
      - JWT_SECRET=change-me-for-dev
    ports:
      - "8080:8080"
    networks:
      - connex-net
  frontend:
    build: ../frontend
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "3000:5173"
    networks:
      - connex-net
volumes:
  mysql-data:
  mongo-data:

networks:
  connex-net:
    driver: bridge
